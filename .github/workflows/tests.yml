name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/app.js
      - name: Test UI interactions against a disposable local server
        run: |
          npm install --no-save --package-lock=false jsdom@26 playwright@1.51.1
          python scripts/run_ui_smoke.py
      - name: Check browser layout and meeting results
        run: |
          npx playwright install --with-deps chromium
          python scripts/run_ui_smoke.py --browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
      - name: Check production configuration
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-not-a-deployed-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: focus.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build container
        run: docker build -t paradeis:test .
      - name: Check production templates and collected assets
        run: |
          docker run --rm --env DEBUG=0 --env ALLOWED_HOSTS=localhost \
            --env SECRET_KEY="$(openssl rand -hex 32)" --entrypoint python \
            paradeis:test -m scripts.check_production
