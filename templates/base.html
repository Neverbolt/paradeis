{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Track focus, time, tasks, and effort.">
  <title>{% block title %}Paradeis{% endblock %}</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'app-icon-192.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link id="app-favicon" rel="icon" href="{% static 'icon.svg' %}" data-focus="{% static 'icon.svg' %}" data-break="{% static 'icon-break.svg' %}" data-mode="focus" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
</body></html>
